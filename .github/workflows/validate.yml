name: Validation T2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Dépendances de validation
        run: pip install -r requirements.txt
      - name: Compiler les sources Python
        run: python -m compileall -q engine tools tests
      - name: Reconstruire les trois RenderJobs depuis les mêmes réponses
        run: |
          python tools/build_render_job.py \
            --answers demo/reponses_demo.json \
            --stage silent_transition_validation \
            --output /tmp/render_job_silent.json
          cmp demo/input_demo.json /tmp/render_job_silent.json
          python tools/build_render_job.py \
            --answers demo/reponses_textes_demo.json \
            --stage dynamic_text_validation \
            --output /tmp/render_job_textes.json
          cmp demo/render_job_textes_demo.json /tmp/render_job_textes.json
          python tools/build_render_job.py \
            --answers demo/reponses_textes_demo.json \
            --stage complete_voice_music_render \
            --music B \
            --voice-mode registered_voice_clips \
            --control-plane github_actions_manual \
            --output /tmp/render_job_complete.json
          cmp demo/render_job_complete_demo.json /tmp/render_job_complete.json
      - name: Verrous de non-régression
        run: |
          python tools/verify_existing_tests_unchanged.py
          python tools/verify_visual_pipeline.py
      - name: Contrats RenderResult et RenderError
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for schema, fixture in [
              ('schemas/render_result.schema.json', 'fixtures/t2-avant-apres/render_result.valid.json'),
              ('schemas/render_error.schema.json', 'fixtures/t2-avant-apres/render_error.unsupported_media.json'),
          ]:
              Draft202012Validator(json.load(open(schema))).validate(json.load(open(fixture)))
              print('T2_SCHEMA_FIXTURE_OK', fixture)
          PY
      - name: Contrat T2
        run: python tools/validate_contract.py
      - name: Tests formulaire, caméras, scènes, textes, voix et mix final
        run: python -m unittest discover -s tests -v
