name: Validation T2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Dépendances de validation
        run: pip install -r requirements.txt
      - name: Compiler les sources Python
        run: python -m compileall -q engine tools tests
      - name: Reconstruire les trois RenderJobs depuis les mêmes réponses
        run: |
          python tools/build_render_job.py \
            --answers demo/reponses_demo.json \
            --stage silent_transition_validation \
            --output /tmp/render_job_silent.json
          cmp demo/input_demo.json /tmp/render_job_silent.json
          python tools/build_render_job.py \
            --answers demo/reponses_textes_demo.json \
            --stage dynamic_text_validation \
            --output /tmp/render_job_textes.json
          cmp demo/render_job_textes_demo.json /tmp/render_job_textes.json
          python tools/build_render_job.py \
            --answers demo/reponses_textes_demo.json \
            --stage complete_voice_music_render \
            --music D \
            --historical-exemplar \
            --voice-mode registered_voice_clips \
            --control-plane github_actions_manual \
            --output /tmp/render_job_complete.json
          cmp demo/render_job_complete_demo.json /tmp/render_job_complete.json
      - name: Verrous de non-régression
        run: |
          python tools/verify_existing_tests_unchanged.py
          python tools/verify_visual_pipeline.py
      - name: Contrats RenderResult, RenderError et Afrofire
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          for schema, fixture in [
              ('schemas/render_result.schema.json', 'fixtures/t2-avant-apres/render_result.valid.json'),
              ('schemas/render_error.schema.json', 'fixtures/t2-avant-apres/render_error.unsupported_media.json'),
              ('schemas/T2_complete_voice_mix_v0_7_0.schema.json', 'config/T2_complete_voice_mix_v0_7_0.json'),
              ('schemas/T2_music_selection_v0_7_0.schema.json', 'config/T2_music_selection_v0_7_0.json'),
              ('schemas/T2_music_pool_v1_0_0.schema.json', 'config/T2_music_pool_v1_0_0.json'),
              *[('schemas/T2_complete_voice_mix_v1_0_0.schema.json', f'config/T2_complete_voice_mix_v1_0_0_{candidate}.json') for candidate in 'ABCD'],
          ]:
              definition = json.load(open(schema))
              Draft202012Validator.check_schema(definition)
              Draft202012Validator(definition, format_checker=FormatChecker()).validate(json.load(open(fixture)))
              print('T2_SCHEMA_FIXTURE_OK', fixture)
          Draft202012Validator.check_schema(json.load(open('schemas/T2_music_selection_state.schema.json')))
          PY
      - name: Contrats Cloudflare générés sans dérive
        run: |
          python tools/build_cloudflare_contracts.py
          git diff --exit-code -- cloudflare/src/capture_flow_contract.ts cloudflare/src/form_contract.ts cloudflare/src/render_job_template.ts cloudflare/src/music_pool_contract.ts
      - name: Contrat T2
        run: python tools/validate_contract.py
      - name: Tests formulaire, caméras, scènes, textes, voix et mix final
        run: python -m unittest discover -s tests -v
