name: Rendu T2 silencieux sur GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t2-silent-release
  cancel-in-progress: false

jobs:
  render-silent:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout T2
        uses: actions/checkout@v5

      - name: Vérifier la référence T1 en lecture seule
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/j9028379-hue/vitrine-video-t1-pilot \
            /tmp/t1-reference
          git -C /tmp/t1-reference sparse-checkout init --cone
          git -C /tmp/t1-reference sparse-checkout set capture-guide config schemas tools .github
          git -C /tmp/t1-reference checkout --detach c656510ab81d31d413dc4dfd74b42671532cd978
          python tools/verify_t1_baseline.py /tmp/t1-reference

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Questions vers RenderJob JSON
        run: |
          python tools/build_render_job.py \
            --answers demo/reponses_demo.json \
            --output demo/render_job_server.json

      - name: Contrat et tests
        run: |
          python -m compileall -q engine tools tests
          python tools/validate_contract.py
          python -m unittest discover -s tests -v

      - name: Télécharger les rushes sur le runner GitHub
        run: python tools/fetch_rushes.py

      - name: Monter la vidéo muette sur le runner GitHub
        run: python engine/render_silent.py --job demo/render_job_server.json

      - name: Vérifier 30 s, 900 images et zéro audio
        run: |
          python tools/validate_silent.py \
            output/T2_AVANT_APRES_TRANSITIONS_SILENT_V0_2_0.mp4
          python tools/make_transition_sheet.py \
            output/T2_AVANT_APRES_TRANSITIONS_SILENT_V0_2_0.mp4

      - name: Artefact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: T2_AVANT_APRES_TRANSITIONS_SILENT_V0_2_0
          path: |
            output/T2_AVANT_APRES_TRANSITIONS_SILENT_V0_2_0.mp4
            output/T2_AVANT_APRES_TRANSITIONS_SILENT_V0_2_0.sha256
            proofs/silent_validation.json
            proofs/server_render_manifest.json
            proofs/T2_SILENT_TRANSITIONS_CONTACT_SHEET.jpg
            demo/render_job_server.json
          retention-days: 30

      - name: Publier la Release silencieuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=t2-avant-apres-v0.2.0-silent
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" \
            output/T2_AVANT_APRES_TRANSITIONS_SILENT_V0_2_0.mp4 \
            output/T2_AVANT_APRES_TRANSITIONS_SILENT_V0_2_0.sha256 \
            proofs/silent_validation.json \
            proofs/server_render_manifest.json \
            proofs/T2_SILENT_TRANSITIONS_CONTACT_SHEET.jpg \
            demo/render_job_server.json \
            ui-screens/T2_PLANCHE_12_ECRANS.png \
            --target "${GITHUB_SHA}" \
            --title "T2 Avant / Après — transitions silencieuses v0.2.0" \
            --notes "Rendu produit exclusivement sur GitHub Actions. Vidéo muette, sans voix, sans musique et sans texte superposé. Les 12 écrans validés restent inchangés."
